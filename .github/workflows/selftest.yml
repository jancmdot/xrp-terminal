name: selftest

# Offline test with fake APIs. Runs on every push that touches the pipeline or config.
on:
  push:
    paths: ["pipeline/**", "config/**", "requirements.txt"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.selftest
